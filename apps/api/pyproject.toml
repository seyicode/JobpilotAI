[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "psycopg[binary]>=3.2,<4", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "python-multipart>=0.0.20", "pypdf>=5,<7", "python-docx>=1.1,<2", "httpx>=0.28,<1", "reportlab>=4.2,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
