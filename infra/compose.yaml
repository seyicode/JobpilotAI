name: jobpilot
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobpilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobpilot}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      MAX_RESUME_BYTES: ${MAX_RESUME_BYTES:-5242880}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../apps/api/src:/app/src:ro
      - ../apps/api/tests:/app/tests:ro
      - ../apps/api/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web/src:/workspace/apps/web/src:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  postgres_data:
